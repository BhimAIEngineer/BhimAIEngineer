<svg viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="50%" stop-color="#2C5364"/>
      <stop offset="100%" stop-color="#0F2027"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="796" height="636" rx="14" fill="#0D1117" stroke="url(#termBorder)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Title bar -->
  <rect x="2" y="2" width="796" height="38" rx="14" fill="#161B22"/>
  <rect x="2" y="26" width="796" height="14" fill="#161B22"/>
  <circle cx="28" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="21" r="6" fill="#27C93F"/>
  <text x="400" y="26" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#8B949E">bhim@dev-machine: ~/industrial-defect-detection</text>

  <g font-family="Fira Code, monospace" font-size="14.5">

    <!-- Stage 1: clone -->
    <text x="26" y="70" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.25s" fill="freeze"/>
      <tspan fill="#00C9FF">➜</tspan> <tspan fill="#2C5364">~</tspan> <tspan fill="#e6edf3">git clone github.com/BhimAIEngineer/industrial-defect-detection.git</tspan>
    </text>
    <text x="26" y="94" opacity="0" fill="#8B949E">
      <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.25s" fill="freeze"/>
      Cloning into 'industrial-defect-detection'... done.
    </text>

    <!-- Stage 2: install -->
    <text x="26" y="128" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.25s" fill="freeze"/>
      <tspan fill="#00C9FF">➜</tspan> <tspan fill="#2C5364">~/industrial-defect-detection</tspan> <tspan fill="#e6edf3">pip install -r requirements.txt -q</tspan>
    </text>
    <text x="26" y="152" opacity="0" fill="#8B949E">
      <animate attributeName="opacity" values="0;1" begin="2.3s" dur="0.25s" fill="freeze"/>
      Successfully installed torch-2.3.0 ultralytics-8.2.0 fastapi-0.111.0 mlflow-2.14.0
    </text>

    <!-- Stage 3: tests -->
    <text x="26" y="186" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="3.0s" dur="0.25s" fill="freeze"/>
      <tspan fill="#00C9FF">➜</tspan> <tspan fill="#2C5364">~/industrial-defect-detection</tspan> <tspan fill="#e6edf3">pytest tests/ -v</tspan>
    </text>
    <text x="26" y="210" opacity="0" fill="#3FE0B5">
      <animate attributeName="opacity" values="0;1" begin="3.6s" dur="0.2s" fill="freeze"/>
      tests/test_inference.py::test_yolo_predict <tspan fill="#27C93F">PASSED</tspan>
    </text>
    <text x="26" y="230" opacity="0" fill="#3FE0B5">
      <animate attributeName="opacity" values="0;1" begin="3.9s" dur="0.2s" fill="freeze"/>
      tests/test_api.py::test_health_endpoint <tspan fill="#27C93F">PASSED</tspan>
    </text>
    <text x="26" y="254" opacity="0" fill="#00FF88" font-weight="700">
      <animate attributeName="opacity" values="0;1" begin="4.3s" dur="0.25s" fill="freeze"/>
      12 passed in 4.82s ✔
    </text>

    <!-- Stage 4: docker build with progress bar -->
    <text x="26" y="288" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="5.0s" dur="0.25s" fill="freeze"/>
      <tspan fill="#00C9FF">➜</tspan> <tspan fill="#2C5364">~/industrial-defect-detection</tspan> <tspan fill="#e6edf3">docker build -t defect-detector:latest .</tspan>
    </text>
    <text x="26" y="312" opacity="0" fill="#8B949E">
      <animate attributeName="opacity" values="0;1" begin="5.7s" dur="0.2s" fill="freeze"/>
      [+] Building layers (12/12)
    </text>
    <rect x="26" y="322" width="300" height="10" rx="5" fill="#161B22" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="5.7s" dur="0.2s" fill="freeze"/>
    </rect>
    <rect x="26" y="322" width="0" height="10" rx="5" fill="url(#barGrad)" filter="url(#softGlow)">
      <animate attributeName="width" values="0;300" begin="5.9s" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="26" y="354" opacity="0" fill="#8B949E">
      <animate attributeName="opacity" values="0;1" begin="7.4s" dur="0.25s" fill="freeze"/>
      => exporting to image ... done
    </text>

    <!-- Stage 5: run + serve -->
    <text x="26" y="388" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="8.1s" dur="0.25s" fill="freeze"/>
      <tspan fill="#00C9FF">➜</tspan> <tspan fill="#2C5364">~/industrial-defect-detection</tspan> <tspan fill="#e6edf3">docker run -d -p 8000:8000 defect-detector:latest</tspan>
    </text>
    <text x="26" y="412" opacity="0" fill="#8B949E">
      <animate attributeName="opacity" values="0;1" begin="8.8s" dur="0.2s" fill="freeze"/>
      [INFO] Loading YOLOv8 weights... OK
    </text>
    <text x="26" y="432" opacity="0" fill="#8B949E">
      <animate attributeName="opacity" values="0;1" begin="9.1s" dur="0.2s" fill="freeze"/>
      [INFO] Connected to MLflow tracking server
    </text>
    <text x="26" y="456" opacity="0" fill="#00FF88" font-weight="700">
      <animate attributeName="opacity" values="0;1" begin="9.5s" dur="0.25s" fill="freeze"/>
      [SUCCESS] Inference API running on port 8000 ✔
    </text>

    <!-- Stage 6: health check -->
    <text x="26" y="490" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="10.2s" dur="0.25s" fill="freeze"/>
      <tspan fill="#00C9FF">➜</tspan> <tspan fill="#2C5364">~/industrial-defect-detection</tspan> <tspan fill="#e6edf3">curl -s localhost:8000/health</tspan>
    </text>
    <text x="26" y="514" opacity="0" fill="#FFD700">
      <animate attributeName="opacity" values="0;1" begin="10.9s" dur="0.25s" fill="freeze"/>
      {"status":"ok","model":"yolov8-defect-v1"}
    </text>

    <!-- Stage 7: skills + tagline -->
    <text x="26" y="548" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="11.6s" dur="0.25s" fill="freeze"/>
      <tspan fill="#00C9FF">➜</tspan> <tspan fill="#2C5364">~</tspan> <tspan fill="#e6edf3">whoami --skills</tspan>
    </text>
    <text x="26" y="572" opacity="0" fill="#FFD700">
      <animate attributeName="opacity" values="0;1" begin="12.3s" dur="0.25s" fill="freeze"/>
      Python · PyTorch · YOLOv8 · FastAPI · Docker · MLflow · LangChain
    </text>
    <text x="26" y="600" opacity="0" fill="#00C9FF" font-weight="700">
      <animate attributeName="opacity" values="0;1" begin="13.1s" dur="0.3s" fill="freeze"/>
      Building complete, deployable ML systems.
    </text>
    <text x="26" y="624" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="13.9s" dur="0.25s" fill="freeze"/>
      <tspan fill="#00C9FF">➜</tspan> <tspan fill="#2C5364">~</tspan>
    </text>
  </g>

  <!-- Blinking cursor -->
  <rect x="52" y="610" width="9" height="16" fill="#00C9FF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.001;0.3;0.55;0.8;1" begin="14.1s" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
