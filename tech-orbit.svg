<svg viewBox="0 0 740 740" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2C5364" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="50%" stop-color="#2C5364"/>
      <stop offset="100%" stop-color="#0F2027"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="370" cy="370" r="380" fill="url(#bgGlow)"/>

  <!-- Orbit ring guides -->
  <circle cx="370" cy="370" r="95" fill="none" stroke="#00C9FF" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="370" cy="370" r="150" fill="none" stroke="#2C5364" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="370" cy="370" r="205" fill="none" stroke="#00C9FF" stroke-opacity="0.14" stroke-width="1"/>
  <circle cx="370" cy="370" r="260" fill="none" stroke="#2C5364" stroke-opacity="0.16" stroke-width="1"/>
  <circle cx="370" cy="370" r="315" fill="none" stroke="#00C9FF" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Central core -->
  <circle cx="370" cy="370" r="65" fill="#0D1117" stroke="url(#coreGrad)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="r" values="63;69;63" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="370" y="382" text-anchor="middle" font-family="Fira Code, monospace" font-size="30" font-weight="700" fill="#00C9FF">BR</text>

  <!-- Ring 1 (r=95, clockwise) — Core languages & DL frameworks -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 370 370" to="360 370 370" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(370,275)">
      <circle r="26" fill="#0D1117" stroke="#3776AB" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#3776AB" font-weight="700">Python</text>
    </g>
    <g transform="translate(465,370)">
      <circle r="26" fill="#0D1117" stroke="#EE4C2C" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#EE4C2C" font-weight="700">PyTorch</text>
    </g>
    <g transform="translate(370,465)">
      <circle r="26" fill="#0D1117" stroke="#FF6F00" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#FF6F00" font-weight="700">TensorFlow</text>
    </g>
    <g transform="translate(275,370)">
      <circle r="26" fill="#0D1117" stroke="#D00000" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#FF6B6B" font-weight="700">Keras</text>
    </g>
  </g>

  <!-- Ring 2 (r=150, counter-clockwise) — Classical ML & data -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 370 370" to="0 370 370" dur="20s" repeatCount="indefinite"/>
    <g transform="translate(476,264)">
      <circle r="26" fill="#0D1117" stroke="#F7931E" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#F7931E" font-weight="700">Sklearn</text>
    </g>
    <g transform="translate(476,476)">
      <circle r="26" fill="#0D1117" stroke="#150458" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#8CA0FF" font-weight="700">Pandas</text>
    </g>
    <g transform="translate(264,476)">
      <circle r="26" fill="#0D1117" stroke="#4DABF7" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#4DABF7" font-weight="700">NumPy</text>
    </g>
    <g transform="translate(264,264)">
      <circle r="26" fill="#0D1117" stroke="#77B300" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#9BE564" font-weight="700">XGBoost</text>
    </g>
  </g>

  <!-- Ring 3 (r=205, clockwise) — Computer vision & NLP -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 370 370" to="360 370 370" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(370,165)">
      <circle r="24" fill="#0D1117" stroke="#00FFFF" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#00FFFF" font-weight="700">YOLOv8</text>
    </g>
    <g transform="translate(565,307)">
      <circle r="24" fill="#0D1117" stroke="#5C3EE8" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#8F7BFF" font-weight="700">OpenCV</text>
    </g>
    <g transform="translate(491,536)">
      <circle r="24" fill="#0D1117" stroke="#3E7CB1" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#6FB1E8" font-weight="700">NLTK</text>
    </g>
    <g transform="translate(250,536)">
      <circle r="24" fill="#0D1117" stroke="#FF6F61" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#FF6F61" font-weight="700">BERT</text>
    </g>
    <g transform="translate(175,307)">
      <circle r="24" fill="#0D1117" stroke="#FFD21E" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#FFD21E" font-weight="700">HuggingFace</text>
    </g>
  </g>

  <!-- Ring 4 (r=260, counter-clockwise) — Generative AI & agents -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 370 370" to="0 370 370" dur="32s" repeatCount="indefinite"/>
    <g transform="translate(523,160)">
      <circle r="24" fill="#0D1117" stroke="#1C9C9C" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#1C9C9C" font-weight="700">LangChain</text>
    </g>
    <g transform="translate(617,450)">
      <circle r="24" fill="#0D1117" stroke="#3FA796" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#3FA796" font-weight="700">LangGraph</text>
    </g>
    <g transform="translate(370,630)">
      <circle r="24" fill="#0D1117" stroke="#10A37F" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#3FE0B5" font-weight="700">OpenAI API</text>
    </g>
    <g transform="translate(123,450)">
      <circle r="24" fill="#0D1117" stroke="#4B8BBE" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#4B8BBE" font-weight="700">FAISS</text>
    </g>
    <g transform="translate(217,160)">
      <circle r="24" fill="#0D1117" stroke="#6C5CE7" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#A29BFE" font-weight="700">ChromaDB</text>
    </g>
  </g>

  <!-- Ring 5 (r=315, clockwise) — MLOps, deployment & cloud -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 370 370" to="360 370 370" dur="40s" repeatCount="indefinite"/>
    <g transform="translate(370,55)">
      <circle r="22" fill="#0D1117" stroke="#009688" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#009688" font-weight="700">FastAPI</text>
    </g>
    <g transform="translate(593,147)">
      <circle r="22" fill="#0D1117" stroke="#2496ED" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#2496ED" font-weight="700">Docker</text>
    </g>
    <g transform="translate(685,370)">
      <circle r="22" fill="#0D1117" stroke="#0194E2" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#0194E2" font-weight="700">MLflow</text>
    </g>
    <g transform="translate(593,593)">
      <circle r="22" fill="#0D1117" stroke="#2088FF" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="7" fill="#2088FF" font-weight="700">GH Actions</text>
    </g>
    <g transform="translate(370,685)">
      <circle r="22" fill="#0D1117" stroke="#F05032" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#F05032" font-weight="700">Git</text>
    </g>
    <g transform="translate(147,593)">
      <circle r="22" fill="#0D1117" stroke="#FF9900" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#FF9900" font-weight="700">AWS</text>
    </g>
    <g transform="translate(55,370)">
      <circle r="22" fill="#0D1117" stroke="#4285F4" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#4285F4" font-weight="700">GCP</text>
    </g>
    <g transform="translate(147,147)">
      <circle r="22" fill="#0D1117" stroke="#0078D4" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#0078D4" font-weight="700">Azure</text>
    </g>
  </g>

  <!-- Twinkling particles -->
  <circle cx="105" cy="105" r="2.5" fill="#00C9FF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="115" r="2" fill="#2C5364">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85" cy="640" r="2" fill="#00C9FF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="655" cy="650" r="2.5" fill="#2C5364">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="370" cy="20" r="2" fill="#00C9FF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="370" cy="720" r="2" fill="#2C5364">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="370" r="2" fill="#00C9FF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="370" r="2" fill="#2C5364">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
